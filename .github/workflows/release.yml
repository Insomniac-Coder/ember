name: release

# `[BLD-10]` — the compile-time budgets of `[BUD-2]` are release gates: a release tag is cut only
# when `tools/compile_budgets.py` passes over `bench/bigpkg`. Its times are normalised by a fixed
# calibration workload against the reference machine's (`[BUD-3a]`), so a runner's speed does not
# decide the gate; a run whose calibration moves more than 10 % is inconclusive (exit 2), not
# failed, and is run again. Every step a release adds goes after `compile-budgets` (`needs:`).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  compile-budgets:
    runs-on: windows-latest
    name: compile-time budgets (release gate)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        run: cargo build --locked --release -p ember_driver --bin ember
      - name: the budgets
        run: python tools/compile_budgets.py --ember target/release/ember.exe --json budgets.json
      - name: the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-budgets
          path: budgets.json

  # `[DOC-2]`, `[DOC-4]` — the guide, the error pages and the specification are published together,
  # for this release: the guide's samples and the pages' examples must all run first
  # (`ember test --doc`), then one archive of the three (`tools/doc_bundle.py`) is attached to the
  # release.
  documentation:
    needs: compile-budgets
    runs-on: ubuntu-latest
    name: the guide, the error pages and the specification
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --locked --release -p ember_driver --bin ember
      - name: every example runs
        run: target/release/ember test --doc
      - name: the archive
        run: python3 tools/doc_bundle.py "${GITHUB_REF_NAME}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: dist/ember-docs-*.zip
      - name: attached to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --notes-file docs/RELEASE-NOTES.md dist/ember-docs-*.zip || gh release upload "${GITHUB_REF_NAME}" dist/ember-docs-*.zip --clobber
