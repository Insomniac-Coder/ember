name: ci

# Part XX §2, Phase 0: "CI (GitHub Actions: windows-latest with MSVC +
# clang-cl, ubuntu-latest with clang + gcc)". The document checks run once,
# on Linux, because they read files rather than compile them.

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Each platform's tests run on four machines at once: one runs every test
  # but the conformance suite, three run a third of its cases each
  # (`EMBER_TEST_SHARD`). Every test still runs on every platform. The tests
  # use the `ci` profile: an optimised compiler with the debug checks kept.
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest, cc: clang }
          - { os: ubuntu-latest, cc: gcc }
          - { os: windows-latest, cc: msvc }
          - { os: windows-latest, cc: clang-cl }
        part: [rest, 1/3, 2/3, 3/3]
    runs-on: ${{ matrix.platform.os }}
    name: ${{ matrix.platform.os }} / ${{ matrix.platform.cc }} / ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      # `[FFI-6]` — `import c` loads libclang at run time. The Windows image has LLVM installed
      # (`C:\Program Files\LLVM\bin\libclang.dll`); the Ubuntu image has no `libclang.so`.
      - name: libclang
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Build
        run: cargo build --workspace --locked --profile ci
      # The platform's own shell: on Windows, Git's bash would put its own
      # `link` ahead of the MSVC linker and Rust could not link the tests.
      - name: Test
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} tools/run_logged.py test-output.txt cargo test --locked --profile ci ${{ matrix.part == 'rest' && '--workspace -- --skip the_conformance_suite_runs' || '-p ember_driver --test milestones -- --exact the_conformance_suite_runs' }}
        env:
          EMBER_CC: ${{ matrix.platform.cc }}
          EMBER_TEST_SHARD: ${{ matrix.part != 'rest' && matrix.part || '' }}

      # A job's log can only be read when signed in; its annotations can be
      # read by anyone. On a failure, the end of the output becomes one.
      - name: failures as an annotation
        if: failure()
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} tools/ci_failure_annotation.py test-output.txt

      # `[DIA-7]` — "CI fails if the conformance suite produces any
      # unclassified borrow error". The file exists only when there is one.
      - name: no unclassified borrow errors
        shell: bash
        run: |
          if find target -name unclassified-borrow-errors.log | grep -q .; then
            echo "unclassified borrow errors (DIA-7):"
            find target -name unclassified-borrow-errors.log -exec cat {} +
            exit 1
          fi

  # `[TST-28]` — the performance gate: `tests/perf/`'s programs against their C twins, each pair
  # built by one toolchain with the release profile and timed on one core. A shared runner that
  # cannot time a C program against its own copy reports itself void, not failed (`[BEN-3]`).
  performance:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest, cc: gcc }
          - { os: windows-latest, cc: msvc }
    runs-on: ${{ matrix.platform.os }}
    name: performance / ${{ matrix.platform.os }} / ${{ matrix.platform.cc }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build
        run: cargo build --locked --profile ci -p ember_driver --bin ember
      # ODR-154 — a report: these runners' processors change from run to run (AMD EPYC of three
      # generations), and a benchmark's ratio with them; the gate of record runs on the reference
      # machine before each push (docs/HANDOFF.md).
      - name: performance report
        run: ${{ runner.os == 'Windows' && 'target/ci/ember.exe' || 'target/ci/ember' }} bench --compare --report --core 1
        env:
          EMBER_CC: ${{ matrix.platform.cc }}

  documents:
    runs-on: ubuntu-latest
    name: specification and registry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The owner's file is the contract, and the hardened copy may differ from
      # it only where the amendment ledger says. An undeclared edit to a rule
      # reads exactly like the specification, which is the point: nobody
      # reviews a change they do not know is there.
      - name: every difference from the owner's specification is declared
        run: python tools/hardening_check.py

      # Part XX §1 ground rule 3 — `docs/spec/` is generated and must not be
      # hand-edited. A hand edit looks exactly like the specification in
      # review, so it is caught mechanically instead.
      - name: docs/spec is the split of docs/spec-source
        run: python tools/split_spec.py --check docs/spec-source/ember-spec.md docs/spec

      # `[XXII.4]`, `[TST-4]`, `[DIA-6a]` — duplicate rule ids, orphaned
      # amendments, rules with no conformance directory, codes missing from
      # the registry, and registry entries citing rules that do not exist.
      - name: rule and error-code index
        run: python tools/rule_index.py

      # `[RT-5]`, `[MAN-4]`, `[MNG-5]` — the symbol prefix, CLI name, manifest
      # name and extensions are spelled in `ember_branding` and nowhere else.
      - name: no hard-coded project names
        run: python tools/check_branding.py
      - name: generated runtime matches its branding source
        run: python tools/generate_runtime.py --check
      - name: runtime generator regression
        run: python tools/test_runtime_generation.py
      - name: annotation output cleanup
        run: python tools/test_annotation_cleanup.py
      # `[STD-28]` — `std.math`'s vector types are written by a script.
      - name: std.math's vectors match their generator
        run: python tools/gen_math_vectors.py --check

      # `[TST-7]` — every fenced `ember` block in Parts I-XVII and Appendix A
      # passes `ember check --syntax-only`, against a recorded baseline of the
      # fragments that cannot yet parse as compilation units.
      - uses: dtolnay/rust-toolchain@stable
      - name: build the compiler for the spec gate
        run: cargo build -p ember_driver --bin ember
      - name: specification code blocks parse
        run: python tools/spec_check.py

      # `[DOC-1]`, `[DIA-6]`, `[PHIL-8a]` — every `docs/errors/EXXXX.md` page's
      # failing example fails with its code and its fix compiles, against a
      # ratcheted baseline of emitted codes without a page. The `import c` pages
      # (`E5001`, `E5010`, `W5002`, …) parse headers with libclang.
      - name: libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: error pages compile as documented
        run: python tools/error_pages.py

      # The README's phase table is computed from the tests and
      # docs/phase-status.json, never entered by hand: a figure rises only when
      # a rule gets a passing test and nothing records it unfinished.
      - name: README phase table matches the evidence
        run: python tools/phase_progress.py --check

      # `[DET-4]` — std.math.det gives the bits of its model, bit for bit.
      - name: std.math.det matches its model
        run: python tools/check_det.py

      # `[TST-6]` — Appendix A is generated from its fixture, so the quick
      # reference cannot drift away from something that parses.
      - name: Appendix A matches its fixture
        run: |
          python tools/spec_check.py --emit-appendix
          git diff --exit-code docs/spec-source/ember-spec.md
