[package]
name = "ember_driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ember_branding.workspace = true
ember_span.workspace = true
ember_diag.workspace = true
ember_lexer.workspace = true
ember_ast.workspace = true
ember_parser.workspace = true
ember_types.workspace = true
ember_typeck.workspace = true
ember_hir.workspace = true
ember_mir.workspace = true
ember_analysis.workspace = true
ember_codegen_c.workspace = true
ember_interp.workspace = true
ember_fmt.workspace = true
ember_build.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json = "1"
# `[FFI-6]` — `import c` parses headers with libclang, loaded at run time: the compiler builds and
# runs without it, and only a program that imports a header needs it.
clang-sys = { version = "1.9", features = ["runtime", "clang_11_0"] }

[lints]
workspace = true

# The compiler is a library (`src/lib.rs`: what an editor links, `[IDE-4]`) and the `ember` command.
[[bin]]
name = "ember"
path = "src/ember.rs"
