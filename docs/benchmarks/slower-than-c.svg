<text x="16" y="243" fill="#e6edf3" xml:space="preserve">another function, 100 million times</text>
<text x="559" y="233.0" fill="#9198a1" text-anchor="end">32 ms</text>
<text x="637" y="233.0" fill="#e6edf3" text-anchor="end">36 ms</text>
<text x="715" y="233.0" fill="#f85149" text-anchor="end" font-weight="600">×1.13</text>
