<text x="895" y="123.0" fill="#e6edf3" text-anchor="end">112 ms</text>
<text x="973" y="123.0" fill="#f85149" text-anchor="end" font-weight="600">×1.75</text>
<text x="16" y="163" fill="#e6edf3" xml:space="preserve">Call a method that changes an object taken from a list, 100 million times</text>
<text x="16" y="183" fill="#e6edf3" xml:space="preserve">(object holding 6 lists)</text>
<text x="559" y="173.0" fill="#9198a1" text-anchor="end">31 ms</text>
<text x="637" y="173.0" fill="#e6edf3" text-anchor="end">36 ms</text>
<text x="715" y="173.0" fill="#f85149" text-anchor="end" font-weight="600">×1.17</text>
<text x="817" y="173.0" fill="#9198a1" text-anchor="end">26 ms</text>
<text x="895" y="173.0" fill="#e6edf3" text-anchor="end">25 ms</text>
<text x="973" y="173.0" fill="#3fb950" text-anchor="end" font-weight="600">×0.99</text>
<rect x="0" y="198" width="997" height="60" fill="#151b23"/>
