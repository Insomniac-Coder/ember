<svg xmlns="http://www.w3.org/2000/svg" width="997" height="266" viewBox="0 0 997 266" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
<rect width="997" height="266" fill="#0d1117" rx="6"/>
